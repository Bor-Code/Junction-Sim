[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "junction-sim"
version = "0.3.0"
description = "A discrete-event traffic simulation library and CLI for benchmarking signal control strategies on single intersections."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [
    { name = "Boran and Junction-Sim Contributors" }
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering",
]
keywords = [
    "traffic",
    "traffic-simulation",
    "signal-control",
    "discrete-event-simulation",
    "intelligent-transportation-systems",
    "reinforcement-learning",
    "nema",
    "benchmarking",
]
dependencies = [
    "pydantic>=2.7.0",
]

[project.urls]
Homepage = "https://github.com/Bor-Code/Junction-Sim"
Documentation = "https://github.com/Bor-Code/Junction-Sim#readme"
Repository = "https://github.com/Bor-Code/Junction-Sim"
Issues = "https://github.com/Bor-Code/Junction-Sim/issues"
Changelog = "https://github.com/Bor-Code/Junction-Sim/blob/main/CHANGELOG.md"

[project.scripts]
junction-sim = "junction_sim.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
    "pre-commit>=3.7.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/junction_sim"]

[tool.ruff]
target-version = "py312"
line-length = 88
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "UP",
    "B",
    "SIM",
]
ignore = []

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_any_generics = true
no_implicit_optional = true
check_untyped_defs = true

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-ra -q --cov=junction_sim --cov-report=term-missing"

[tool.coverage.run]
branch = true
source = ["src/junction_sim"]

[tool.coverage.report]
show_missing = true
fail_under = 90
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "\\.\\.\\.",
]
